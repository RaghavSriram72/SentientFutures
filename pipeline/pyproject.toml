[project]
name = "sf-pipeline"
version = "0.1.0"
description = "Finds new papers for the Sentient Futures site, triages them with Claude and queues them for human review"
requires-python = ">=3.12"
# sf-shared (the schema in ../shared) is a dependency too, but it isn't on
# PyPI, so install it first: pip install -e ./shared -e ./pipeline
dependencies = [
    "anthropic>=2.3,<3",
    "httpx>=0.28,<1",
    "tenacity>=9,<10",
    "pymongo>=4.10,<5",
    "mongomock>=4.3,<5",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sf_pipeline*"]

# The triage prompt ships inside the package so an installed copy can find it.
[tool.setuptools.package-data]
sf_pipeline = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
