# Lets the three Python suites run together from the repo root:
#
#     .venv/bin/python -m pytest -q shared pipeline/tests backend/tests
#
# Without a config here, pytest takes shared/pyproject.toml as its config and
# shared/ as its root. The pipeline and backend conftest files then sit outside
# the root, their fixtures stop being scoped to their own folders, and the
# backend's "db" fixture replaces the pipeline's.
[pytest]
testpaths = shared/tests pipeline/tests backend/tests
