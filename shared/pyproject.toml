[project]
name = "sf-shared"
version = "0.1.0"
description = "Shared schema for the Sentient Futures site, backend and pipeline"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sf_shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
