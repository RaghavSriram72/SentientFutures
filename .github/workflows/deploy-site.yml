# Builds the static site and publishes it to GitHub Pages.
#
# The site is built from a data folder (.site-data/) that the export step
# makes from content/ plus what the team approved and published in admin
# (sources, milestones, blog posts), read from the API's /api/public routes.
# See shared/sf_shared/export_site.py.
#
# It runs on every push to main, every night, and when someone presses
# "Publish to site" in admin (the API starts it through workflow_dispatch).
#
# One-time setup:
#   - Settings > Pages > Source must be "GitHub Actions". With "Deploy from a
#     branch" this workflow can't deploy.
#   - Settings > Secrets and variables > Actions > Variables: set API_URL to
#     the API's address (e.g. https://sentient-futures-api-xxxxx.ondigitalocean.app).
#     The export reads published data from it, and the admin pages talk to it.
#     Without it the site is built from content/ alone, and admin says it
#     isn't connected to a server.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly rebuild, so the timeline's "Now" line (fixed at build time) stays
    # current and anything approved or published in admin since gets picked up.
    - cron: "17 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A deploy that has started is never cancelled halfway;
# newer runs wait their turn.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the shared schema
        run: pip install -e shared

      # Same check as CI. A broken content/ never gets built, and Pages keeps
      # serving the last good deploy.
      - name: Validate content
        run: python -m sf_shared.validate content/

      # content/ plus the API's published sources, milestones and posts, checked
      # with the same validator. If the API can't be reached or the result
      # doesn't validate, the deploy stops here and Pages keeps the last good site.
      - name: Export published data
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          args=(--content content --out .site-data)
          if [ -n "$API_URL" ]; then args+=(--api "$API_URL"); fi
          python -m sf_shared.export_site "${args[@]}"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Plain configure-pages on purpose. Don't set static_site_generator: next,
      # because it rewrites basePath in next.config and breaks every URL.
      - uses: actions/configure-pages@v5

      # The base path is the repo name, because a project site lives at
      # https://<user>.github.io/SentientFutures/. Set it to "" after the
      # custom domain switch.
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /SentientFutures
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
          DATA_DIR: ${{ github.workspace }}/.site-data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
